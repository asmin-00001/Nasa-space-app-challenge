<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="mAtmo" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#fb923c" stop-opacity="0"/>
      <stop offset="88%" stop-color="#f97316" stop-opacity="0.42"/>
      <stop offset="94%" stop-color="#ea580c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mSurf" cx="32%" cy="28%" r="76%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="28%" stop-color="#ea580c"/>
      <stop offset="62%" stop-color="#9a3412"/>
      <stop offset="88%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1c0602"/>
    </radialGradient>
    <radialGradient id="mTerm" cx="30%" cy="28%" r="74%">
      <stop offset="48%" stop-color="#000" stop-opacity="0"/>
      <stop offset="76%" stop-color="#1a0501" stop-opacity="0.48"/>
      <stop offset="92%" stop-color="#090200" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.96"/>
    </radialGradient>
    <radialGradient id="mLimb" cx="50%" cy="50%" r="50%">
      <stop offset="92%" stop-color="#fdba74" stop-opacity="0"/>
      <stop offset="98%" stop-color="#fed7aa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="mBlur"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="mClip"><circle cx="200" cy="200" r="170"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="196" fill="url(#mAtmo)"/>
  <circle cx="200" cy="200" r="170" fill="url(#mSurf)"/>
  <g clip-path="url(#mClip)">
    <!-- Dark basaltic Syrtis Major & Acidalia albedo regions -->
    <g fill="#5c1d09" filter="url(#mBlur)" opacity="0.62">
      <path d="M90,115 Q145,95 190,125 Q225,148 195,180 Q155,198 112,175 Q75,152 90,115 Z"/>
      <path d="M210,165 Q265,150 315,182 Q345,212 308,248 Q265,268 228,236 Q192,204 210,165 Z"/>
      <path d="M115,235 Q165,222 205,252 Q232,278 188,298 Q140,305 112,275 Z"/>
    </g>
    <!-- Valles Marineris canyon scar -->
    <path d="M118,196 Q178,214 248,204 Q275,200 288,210 Q255,222 182,226 Q132,222 118,196 Z" fill="#3b0f04" opacity="0.72" filter="url(#mBlur)"/>
    <!-- Brighter dust plains (Elysium / Hellas) -->
    <ellipse cx="145" cy="148" rx="34" ry="22" fill="#fed7aa" opacity="0.25" filter="url(#mBlur)"/>
    <ellipse cx="255" cy="272" rx="38" ry="26" fill="#fdba74" opacity="0.22" filter="url(#mBlur)"/>
    <!-- Realistic shaded impact craters -->
    <g>
      <circle cx="152" cy="162" r="14" fill="#451205" opacity="0.45"/>
      <path d="M139,158 A14,14 0 0,1 163,154" fill="none" stroke="#fed7aa" stroke-width="1.4" stroke-opacity="0.45"/>
      <circle cx="242" cy="138" r="19" fill="#451205" opacity="0.4"/>
      <path d="M225,132 A19,19 0 0,1 258,128" fill="none" stroke="#fed7aa" stroke-width="1.6" stroke-opacity="0.4"/>
      <circle cx="188" cy="264" r="11" fill="#451205" opacity="0.45"/>
      <path d="M178,261 A11,11 0 0,1 197,258" fill="none" stroke="#fed7aa" stroke-width="1.2" stroke-opacity="0.4"/>
      <circle cx="104" cy="212" r="16" fill="#451205" opacity="0.38"/>
      <path d="M89,207 A16,16 0 0,1 118,204" fill="none" stroke="#fed7aa" stroke-width="1.3" stroke-opacity="0.4"/>
    </g>
    <!-- North & South Polar Ice Caps -->
    <path d="M152,35 Q200,56 248,35 L234,26 L166,26 Z" fill="#fff7ed" opacity="0.92" filter="url(#mBlur)"/>
    <path d="M164,366 Q200,350 236,366 L224,376 L176,376 Z" fill="#fed7aa" opacity="0.65" filter="url(#mBlur)"/>
    <circle cx="200" cy="200" r="170" fill="url(#mTerm)"/>
    <circle cx="200" cy="200" r="170" fill="url(#mLimb)"/>
  </g>
</svg>