<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="lnGlow" cx="50%" cy="50%" r="50%">
      <stop offset="84%" stop-color="#94a3b8" stop-opacity="0"/>
      <stop offset="89%" stop-color="#cbd5e1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
