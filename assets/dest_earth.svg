<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="eAtmoOuter" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="88%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="93%" stop-color="#93c5fd" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eOcean" cx="32%" cy="28%" r="76%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="30%" stop-color="#1d4ed8"/>
      <stop offset="62%" stop-color="#1e3a8a"/>
      <stop offset="86%" stop-color="#091534"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="eSpec" cx="29%" cy="26%" r="35%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eLand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="45%" stop-color="#3f6212"/>
      <stop offset="75%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <radialGradient id="eTerminator" cx="30%" cy="28%" r="74%">
      <stop offset="48%" stop-color="#000" stop-opacity="0"/>
      <stop offset="76%" stop-color="#020617" stop-opacity="0.45"/>
      <stop offset="92%" stop-color="#020617" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.96"/>
    </radialGradient>
    <radialGradient id="eLimb" cx="50%" cy="50%" r="50%">
      <stop offset="91%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="97.5%" stop-color="#bae6fd" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="eCloudBlur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="eSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <clipPath id="eClip"><circle cx="200" cy="200" r="170"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="196" fill="url(#eAtmoOuter)"/>
  <circle cx="200" cy="200" r="170" fill="url(#eOcean)"/>
  <circle cx="200" cy="200" r="170" fill="url(#eSpec)"/>
  <g clip-path="url(#eClip)">
    <!-- Continental landmasses with coastal shelf glow -->
    <g filter="url(#eSoft)" opacity="0.92">
      <path d="M126,95 Q155,78 188,92 Q218,104 228,132 Q236,158 214,178 Q195,195 198,224 Q202,256 178,278 Q154,292 142,265 Q132,235 144,205 Q152,182 128,166 Q104,150 112,122 Z" fill="url(#eLand)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
      <path d="M235,120 Q272,108 308,128 Q340,148 336,186 Q332,220 296,228 Q265,234 252,206 Q238,180 225,158 Q216,138 235,120 Z" fill="url(#eLand)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
      <path d="M254,244 Q282,238 296,262 Q306,288 280,304 Q252,312 244,284 Q238,260 254,244 Z" fill="#92400e" opacity="0.85"/>
      <path d="M72,188 Q98,176 112,204 Q120,234 96,256 Q72,268 62,238 Q54,210 72,188 Z" fill="url(#eLand)"/>
    </g>
    <!-- Polar ice caps -->
    <path d="M135,34 Q200,52 265,34 L250,25 L150,25 Z" fill="#f8fafc" opacity="0.88" filter="url(#eSoft)"/>
    <path d="M145,368 Q200,350 255,368 L240,378 L160,378 Z" fill="#e2e8f0" opacity="0.75" filter="url(#eSoft)"/>
    <!-- Cyclonic atmospheric cloud bands -->
    <g fill="#ffffff" filter="url(#eCloudBlur)">
      <path d="M68,128 Q125,104 185,134 T305,122 Q335,136 292,154 Q235,172 175,148 Q115,126 68,128 Z" opacity="0.62"/>
      <path d="M95,186 Q155,168 215,196 T332,188 Q348,205 298,214 Q230,224 172,202 Q122,186 95,186 Z" opacity="0.52"/>
      <path d="M75,248 Q140,228 205,258 T318,244 Q330,264 275,274 Q205,284 145,264 Q95,250 75,248 Z" opacity="0.58"/>
      <path d="M118,82 Q175,66 238,86 Q268,96 226,104 Q172,112 118,82 Z" opacity="0.48"/>
      <path d="M112,306 Q178,292 246,312 Q272,322 224,330 Q168,336 112,306 Z" opacity="0.45"/>
    </g>
    <!-- Day/Night Terminator & Rayleigh Limb -->
    <circle cx="200" cy="200" r="170" fill="url(#eTerminator)"/>
    <circle cx="200" cy="200" r="170" fill="url(#eLimb)"/>
  </g>
</svg>